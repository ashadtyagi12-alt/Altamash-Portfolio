<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="800" height="1100">
  <defs>
    <!-- Gradients -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2A687" />
      <stop offset="60%" stop-color="#C58564" />
      <stop offset="100%" stop-color="#9C5D3E" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F232E" />
      <stop offset="70%" stop-color="#0E1017" />
      <stop offset="100%" stop-color="#05060A" />
    </linearGradient>
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1D28" />
      <stop offset="40%" stop-color="#121520" />
      <stop offset="100%" stop-color="#07080D" />
    </linearGradient>
    <linearGradient id="redRimGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3B47" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#FF3B47" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="bottomFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#07080D" stop-opacity="0" />
      <stop offset="75%" stop-color="#07080D" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#07080D" stop-opacity="1" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Rim Aura -->
  <ellipse cx="400" cy="460" rx="260" ry="340" fill="url(#redRimGlow)" opacity="0.35" filter="url(#neonGlow)" />

  <g id="portrait-body">
    <!-- Back Collar & Hoodie -->
    <path d="M 230 650 Q 400 680 570 650 L 670 1000 Q 400 1060 130 1000 Z" fill="#0E1119" />

    <!-- Torso / Jacket -->
    <path d="M 240 640 L 150 920 L 220 1060 L 580 1060 L 650 920 L 560 640 Z" fill="url(#jacketGrad)" />
    
    <!-- Red Accent Inner Zip & Collar Highlight -->
    <path d="M 396 680 L 396 1040 L 404 1040 L 404 680 Z" fill="#FF3B47" opacity="0.9" />
    <path d="M 320 660 L 400 750 L 480 660" fill="none" stroke="#FF3B47" stroke-width="3" opacity="0.6" />

    <!-- Neck -->
    <path d="M 345 520 L 345 660 Q 400 680 455 660 L 455 520 Z" fill="url(#skinGrad)" />
    <!-- Neck shadow under chin -->
    <path d="M 345 520 Q 400 580 455 520 Q 400 550 345 520 Z" fill="#80472B" opacity="0.65" />

    <!-- Head / Jawline -->
    <path d="M 305 350 C 305 230, 495 230, 495 350 C 495 440, 470 535, 400 545 C 330 535, 305 440, 305 350 Z" fill="url(#skinGrad)" />

    <!-- Ears -->
    <path d="M 295 365 C 285 365, 285 425, 305 435 Z" fill="#C58564" />
    <path d="M 505 365 C 515 365, 515 425, 495 435 Z" fill="#B97858" />

    <!-- Designer Modern Glasses (Sleek Dark Matte with Red Rim Reflection) -->
    <rect x="325" y="348" width="62" height="34" rx="8" fill="#0A0C12" stroke="#FF3B47" stroke-width="2.5" />
    <rect x="413" y="348" width="62" height="34" rx="8" fill="#0A0C12" stroke="#FF3B47" stroke-width="2.5" />
    <line x1="387" y1="360" x2="413" y2="360" stroke="#FF3B47" stroke-width="3" />
    <!-- Glasses lens reflection -->
    <path d="M 332 354 L 370 354 L 350 376 L 332 376 Z" fill="#FFFFFF" opacity="0.15" />
    <path d="M 420 354 L 458 354 L 438 376 L 420 376 Z" fill="#FFFFFF" opacity="0.15" />

    <!-- Beard / Stubble -->
    <path d="M 340 455 C 370 515, 430 515, 460 455 C 470 480, 445 530, 400 538 C 355 530, 330 480, 340 455 Z" fill="#1C1E26" opacity="0.55" />

    <!-- Hair (Sharp Modern Textured Fade) -->
    <path d="M 295 340 C 290 280, 320 170, 400 170 C 475 170, 508 270, 505 340 C 495 240, 460 200, 400 200 C 335 200, 305 250, 295 340 Z" fill="url(#hairGrad)" />
    <!-- Hair Volume Top -->
    <path d="M 310 240 Q 340 150 405 150 Q 480 150 495 220 Q 460 175 400 175 Q 340 175 310 240 Z" fill="#2D3240" />

    <!-- Headphones Around Neck (Studio Creator vibe) -->
    <path d="M 280 500 C 265 620, 275 660, 340 680" fill="none" stroke="#252936" stroke-width="28" stroke-linecap="round" />
    <path d="M 520 500 C 535 620, 525 660, 460 680" fill="none" stroke="#252936" stroke-width="28" stroke-linecap="round" />
    <!-- Headphone Cups -->
    <rect x="250" y="520" width="38" height="60" rx="12" fill="#181B24" stroke="#FF3B47" stroke-width="3" />
    <rect x="512" y="520" width="38" height="60" rx="12" fill="#181B24" stroke="#FF3B47" stroke-width="3" />
  </g>

  <!-- Bottom Gradient Mask to seamlessly fade portrait into #07080D dark background -->
  <rect x="0" y="680" width="800" height="420" fill="url(#bottomFade)" />
</svg>
